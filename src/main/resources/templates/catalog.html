<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PawsStore - Catalog</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/catalog.css">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<section class="hero">
    <div class="hero-text">
        <h1 th:text="#{nav.shop}">Shop All Products</h1>
        <p>Discover the best products for your furry friends</p>
    </div>
</section>

<main class="catalog-main">
    <!-- БОКОВАЯ ПАНЕЛЬ ФИЛЬТРОВ -->
    <aside class="sidebar">
        <form id="filterForm">
            <h3 class="sidebar-title">Filters</h3>

            <!-- Секция рейтинга -->
            <div class="filter-section">
                <h4 class="section-title">Rating</h4>
                <div class="checkbox-list">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="ratings" value="5">
                        <span>5 Stars</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="ratings" value="4">
                        <span>4 Stars</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="ratings" value="3">
                        <span>3 Stars</span>
                    </label>
                </div>
            </div>

            <!-- Секция цены -->
            <div class="filter-section">
                <h4 class="section-title">Price Range</h4>
                <div class="price-container">
                    <div class="price-field">
                        <span class="field-label">Min</span>
                        <div class="input-wrapper">
                            <span class="currency">$</span>
                            <input type="text" name="minPrice" value="0">
                        </div>
                    </div>

                    <span class="price-divider">—</span>

                    <div class="price-field">
                        <span class="field-label">Max</span>
                        <div class="input-wrapper">
                            <span class="currency">$</span>
                            <input type="text" name="maxPrice" value="1000">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </aside>

    <section class="content">
        <!-- ТУЛБАР -->
        <div class="toolbar">
            <span id="product-count" th:text="${products.size()} + ' products'">0 products</span>
            <div class="sort">
                <span th:text="#{sort.label}">Sort by:</span>
                <select name="sortBy" id="sortBySelector">
                    <option value="name">Name (A-Z)</option>
                    <option value="price">Price</option>
                    <option value="rating">Rating</option>
                </select>
                <select name="direction" id="directionSelector">
                    <option value="asc">↑ Low to High</option>
                    <option value="desc">↓ High to Low</option>
                </select>
            </div>
        </div>

        <!-- СЕТКА ТОВАРОВ -->
        <div class="products-grid" id="products-grid">
            <div class="card" th:each="p : ${products}">
                <div class="img-wrapper">
                    <a th:href="@{'/product/' + ${p.id}}">
                        <img th:src="${p.imageUrl}" th:alt="${p.nameEn}">
                    </a>

                    <!-- Оранжевая пилюля цены (видна всегда) -->
                    <span class="price-pill" th:text="'$' + ${p.price}">$0.00</span>

                    <!-- ВСПЛЫВАЮЩАЯ КАРТОЧКА ПРИ НАВЕДЕНИИ -->
                    <div class="hover-card">
                        <div class="hover-content">
                            <h4 th:text="${#locale.language == 'ru' ? p.nameRu : p.nameEn}">Product Name</h4>
                            <div class="rating">
                                <span th:each="i : ${#numbers.sequence(1, 5)}">
                                    <span th:style="${p.rating >= i ? 'color: #FFB800' : 'color: #ccc'}">★</span>
                                </span>
                                <span class="review-count" th:text="'(' + ${p.reviewsCount} + ')'"></span>
                            </div>
                            <div class="hover-bottom">
                                <span class="hover-price" th:text="'$' + ${p.price}">$0.00</span>
                                <!-- Кнопка добавления в корзину (быстрая покупка) -->
                                <button class="quick-add-btn"
                                        th:onclick="addToCart([[${p.id}]], [[${#locale.language == 'ru' ? p.nameRu : p.nameEn}]], [[${p.price}]], [[${p.imageUrl}]])">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="9" cy="21" r="1"></circle>
                                        <circle cx="20" cy="21" r="1"></circle>
                                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- НИЖНЯЯ ЧАСТЬ КАРТОЧКИ (ВСЕГДА ВИДНА) -->
                <div class="card-body">
                    <h4 th:text="${#locale.language == 'ru' ? p.nameRu : p.nameEn}">Product Name</h4>
                    <div class="rating-faint">
                        <span th:each="i : ${#numbers.sequence(1, 5)}">
                            <span th:style="${p.rating >= i ? 'color: #FFB800' : 'color: #ccc'}">★</span>
                        </span>
                        <span class="review-count" th:text="'(' + ${p.reviewsCount} + ')'"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="/js/catalog-reactive.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/theme.js"></script>
</body>
</html>
