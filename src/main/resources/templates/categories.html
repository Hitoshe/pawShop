<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.categories}">Categories</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/info.css">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="info-container">
    <h1 th:text="#{nav.categories}">Categories</h1>
    <div class="category-grid">
        <a href="/?category=Dogs" class="cat-card">
            <div class="cat-icon">🐶</div>
            <h3 th:text="${#locale.language == 'ru' ? 'Для собак' : 'For Dogs'}">Dogs</h3>
        </a>
        <a href="/?category=Cats" class="cat-card">
            <div class="cat-icon">🐱</div>
            <h3 th:text="${#locale.language == 'ru' ? 'Для кошек' : 'For Cats'}">Cats</h3>
        </a>
        <a href="/" class="cat-card">
            <div class="cat-icon">🐹</div>
            <h3 th:text="${#locale.language == 'ru' ? 'Другие питомцы' : 'Other Pets'}">Others</h3>
        </a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="/js/theme.js"></script>
</body>
</html>
