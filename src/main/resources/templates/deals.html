<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.deals}">Hot Deals</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/catalog.css"> <!-- Реиспользуем стили сетки -->
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<section class="hero deals-hero" style="background: linear-gradient(90deg, #F00 0%, #FF6A00 100%);">
    <div class="hero-text">
        <h1 th:text="#{nav.deals}">Hot Deals</h1>
        <p>Grab your favorites with special discounts!</p>
    </div>
</section>

<main class="catalog-main" style="display: block;"> <!-- Без сайдбара, во всю ширину -->
    <div class="products-grid">
        <div class="card" th:each="p : ${products}">
            <a th:href="@{'/product/' + ${p.id}}">
                <div class="img-wrapper">
                    <!-- Бейдж скидки -->
                    <span class="sale-badge">SALE</span>
                    <img th:src="${p.imageUrl}">
                    <span class="price-pill" th:text="'$' + ${p.price}">$54.99</span>
                </div>
                <div class="card-body">
                    <h4 th:text="${#locale.language == 'ru' ? p.nameRu : p.nameEn}">Product</h4>
                    <div class="price-row">
                        <span class="current-price" th:text="'$' + ${p.price}"></span>
                        <!-- Перечеркнутая старая цена -->
                        <span class="old-price" th:if="${p.oldPrice != null}" th:text="'$' + ${p.oldPrice}"></span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="/js/theme.js"></script>
</body>
</html>
