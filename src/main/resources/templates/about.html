<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.about}">About Us</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/info.css">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="info-container about-page">
    <div class="about-content">
        <h1 th:text="#{nav.about}">About PawsStore</h1>
        <p th:text="${#locale.language == 'ru' ?
                'PawsStore — это не просто магазин, это сообщество любителей животных. Мы выбираем только лучшие товары для ваших четвероногих друзей.' :
                'PawsStore is more than just a shop, it is a community of pet lovers. We select only the best products for your furry friends.'}">
        </p>
        <img src="/images/LogoAndName.png" alt="Logo" width="200" style="margin-top: 30px;">
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="/js/theme.js"></script>
</body>
</html>
