<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{cart.title} ?: 'Shopping Bag'">Cart</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/cart.css">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="cart-container">
    <h1 th:text="#{cart.title} ?: 'Shopping Bag'">Shopping Bag</h1>

    <div class="cart-wrapper">
        <!-- БЛОК ТОВАРОВ: Сюда cart-page.js вставит HTML для каждого товара из localStorage -->
        <div id="cart-items" class="cart-items-list"></div>

        <!-- ИТОГОВАЯ ИНФОРМАЦИЯ -->
        <aside class="order-summary">
            <h3 th:text="#{cart.summary} ?: 'Order Summary'">Order Summary</h3>

            <!-- Промокод (логика в JS) -->
            <div class="promo-block">
                <input type="text" id="promo-input" placeholder="Promo code">
                <button onclick="applyPromo()" class="btn-secondary" th:text="#{cart.apply}">Apply</button>
            </div>

            <hr>

            <!-- Подсчет стоимости -->
            <div class="summary-row">
                <span>Subtotal:</span>
                <span id="subtotal">$0</span>
            </div>
            <div id="discount-row" class="summary-row" style="display:none; color: #EE2A7B;">
                <span>Discount (10%):</span>
                <span id="discount-val">-$0</span>
            </div>
            <div class="summary-row total">
                <strong>Total:</strong>
                <strong id="final-total">$0</strong>
            </div>

            <!-- Заглушка кнопки оформления -->
            <button class="btn-primary checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </aside>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<!-- Порядок скриптов важен: общая корзина -> логика отрисовки -> тема -->
<script src="/js/cart.js"></script>
<script src="/js/cart-page.js"></script>
<script src="/js/theme.js"></script>
</body>
</html>
