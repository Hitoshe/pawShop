<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ФРАГМЕНТ ШАПКИ: подключается на всех страницах -->
<header th:fragment="header" class="header">
    <div class="header-content">
        <!-- Логотип: ведет на главную -->
        <a href="/" class="logo">
            <img src="/images/LogoAndName.png" alt="PawsStore">
        </a>

        <!-- Основная навигация: тексты берутся из messages.properties (i18n) -->
        <nav class="nav">
            <a href="/" th:text="#{nav.shop}">Shop</a>
            <a href="/categories" th:text="#{nav.categories}">Categories</a>
            <a href="/deals" th:text="#{nav.deals}">Deals</a>
            <a href="/about" th:text="#{nav.about}">About</a>
        </nav>

        <!-- Блок действий (языки, тема, корзина) -->
        <div class="actions">
            <div class="lang-switch">
                <!-- Переключение языка: добавляет ?lang=en или ?lang=ru к текущему URL -->
                <a th:href="@{''(lang='en')}">EN</a> |
                <a th:href="@{''(lang='ru')}">RU</a>
            </div>

            <!-- Кнопка переключения темы (темная/светлая), управляется через theme.js -->
            <button id="theme-toggle" class="theme-btn">🌙</button>

            <!-- Иконка корзины с "баджем" (количеством товаров) -->
            <a href="/cart" class="cart-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <!-- Badge заполнится скриптом cart.js из localStorage -->
                <span id="cart-badge" class="badge">0</span>
            </a>
        </div>
    </div>
</header>

<!-- ФРАГМЕНТ ПОДВАЛА -->
<footer th:fragment="footer" class="footer">
    <div class="footer-grid">
        <div class="footer-brand">
            <img src="/images/LogoAndName.png" alt="PawsStore" width="150" class="footer-logo">
            <p>Your trusted source for premium pet supplies.</p>
        </div>
        <div class="footer-links">
            <h4 th:text="#{nav.shop}">Shop</h4>
            <a href="/">All Products</a>
            <a href="#">New Arrivals</a>
        </div>
        <!-- Заглушка для подписки на новости -->
        <div class="footer-newsletter">
            <h4>Newsletter</h4>
            <div class="newsletter-form">
                <input type="email" placeholder="Your email">
                <button>✉️</button>
            </div>
        </div>
    </div>
    <div class="footer-bottom">
        <p>&copy; 2026 PawsStore. All rights reserved.</p>
        <div class="social-links">
            <a href="#">📘</a> <a href="#">🐦</a> <a href="#">📸</a>
        </div>
    </div>
</footer>
</html>
