<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${#locale.language == 'ru' ? product.nameRu : product.nameEn}">Product Detail</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/product.css">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="product-page">
    <!-- БЛОК ГАЛЕРЕИ -->
    <div class="gallery">
        <div class="slider-wrapper">
            <!-- Кнопки переключения слайдов (вызывают JS функции внизу) -->
            <button type="button" class="slider-btn prev" onclick="changeSlide(-1)">❮</button>
            <div class="main-img">
                <img th:src="${product.imageUrl}" id="main-display" alt="Product Image">
            </div>
            <button type="button" class="slider-btn next" onclick="changeSlide(1)">❯</button>
        </div>

        <!-- Миниатюры: клик по ним меняет главную картинку -->
        <div class="thumbs">
            <img th:src="${product.imageUrl}" class="thumb-item active" onclick="setSlide(0)">
            <img th:src="${product.imageUrl2}" class="thumb-item" onclick="setSlide(1)">
            <img th:src="${product.imageUrl3}" class="thumb-item" onclick="setSlide(2)">
        </div>
    </div>

    <!-- БЛОК ИНФОРМАЦИИ -->
    <div class="details">
        <div class="badge-cat" th:text="${#locale.language == 'ru' ? product.categoryRu : product.categoryEn}">Category</div>
        <h1 th:text="${#locale.language == 'ru' ? product.nameRu : product.nameEn}">Name</h1>
        <div class="price-large" th:text="'$' + ${product.price}">$0.00</div>
        <p class="desc" th:text="${#locale.language == 'ru' ? product.fullDescriptionRu : product.fullDescriptionEn}"></p>

        <!-- ПОКУПКА: Выбор количества и кнопка -->
        <div class="purchase-row">
            <div class="qty">
                <button type="button" onclick="changeQty(-1)">-</button>
                <input type="number" value="1" id="qnt" readonly>
                <button type="button" onclick="changeQty(1)">+</button>
            </div>
            <!-- Вызывает функцию из cart.js, передавая данные товара в localStorage -->
            <button class="btn-primary add-btn"
                    th:onclick="addToCart([[${product.id}]], [[${#locale.language == 'ru' ? product.nameRu : product.nameEn}]], [[${product.price}]], [[${product.imageUrl}]])"
                    th:text="#{btn.add_to_cart}">
                Add to Cart
            </button>
        </div>

        <!-- ХАРАКТЕРИСТИКИ (Аккордеон на чистом HTML5) -->
        <div class="accordion">
            <details open>
                <summary th:text="#{label.specs}">Specs</summary>
                <div class="acc-content">
                    <p><b th:text="#{label.dimensions}">Dim:</b> <span th:text="${#locale.language == 'ru' ? product.dimensionsRu : product.dimensionsEn}"></span></p>
                    <p><b th:text="#{label.material}">Mat:</b> <span th:text="${#locale.language == 'ru' ? product.materialRu : product.materialEn}"></span></p>
                    <p><b th:text="#{label.weight}">Weight:</b> <span th:text="${#locale.language == 'ru' ? product.weightLimitRu : product.weightLimitEn}"></span></p>
                </div>
            </details>
        </div>

        <!-- ФОРМА ОТПРАВКИ ОТЗЫВА -->
        <section class="add-review-container">
            <h3 th:text="#{review.write}">Write a Review</h3>
            <form th:action="@{'/product/' + ${product.id} + '/review'}" method="post" class="review-styled-form">
                <div class="form-inline-row">
                    <div class="form-group">
                        <label th:text="#{review.name_placeholder}">Your Name</label>
                        <input type="text" name="author" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Rating</label>
                        <select name="rating">
                            <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                            <option value="4">⭐⭐⭐⭐ (4)</option>
                            <option value="3">⭐⭐⭐ (3)</option>
                            <option value="2">⭐⭐ (2)</option>
                            <option value="1">⭐ (1)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label th:text="#{review.comment_placeholder}">Comment</label>
                    <textarea name="comment" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn-primary submit-review-btn" th:text="#{review.post}">Post Review</button>
            </form>
        </section>

        <!-- СПИСОК СУЩЕСТВУЮЩИХ ОТЗЫВОВ -->
        <section class="reviews-section">
            <h3 th:text="#{label.reviews}">Reviews</h3>
            <div th:if="${reviews == null || reviews.isEmpty()}" class="no-reviews">No reviews yet.</div>

            <div class="review-item" th:each="rev : ${reviews}">
                <div class="review-header">
                    <div class="rev-author-info">
                        <strong th:text="${rev.author}">Author</strong>
                        <span class="rev-date" th:text="${rev.date}">Date</span>
                    </div>
                    <div class="stars-row">
                        <!-- Звезды для конкретного отзыва -->
                        <span th:each="i : ${#numbers.sequence(1, 5)}" th:style="${i <= rev.rating ? 'color: #FFB800' : 'color: #ccc'}">★</span>
                    </div>
                </div>
                <p class="rev-text" th:text="${rev.comment}"></p>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="/js/cart.js"></script>
<script src="/js/theme.js"></script>

<!-- ИНЛАЙН СКРИПТ: Логика галереи -->
<script th:inline="javascript">
    /* Передаем URL картинок из Java-модели в JS-массив */
    const images = [
        /*[[${product.imageUrl}]]*/ '',
        /*[[${product.imageUrl2}]]*/ '',
        /*[[${product.imageUrl3}]]*/ ''
    ];
    let currentIndex = 0;

    function updateGallery() {
        document.getElementById('main-display').src = images[currentIndex];
        const thumbs = document.querySelectorAll('.thumb-item');
        thumbs.forEach((img, i) => img.classList.toggle('active', i === currentIndex));
    }

    function changeSlide(dir) {
        currentIndex += dir;
        if (currentIndex >= images.length) currentIndex = 0;
        if (currentIndex < 0) currentIndex = images.length - 1;
        updateGallery();
    }

    function setSlide(idx) {
        currentIndex = idx;
        updateGallery();
    }

    /* Изменение количества для покупки */
    function changeQty(v) {
        const input = document.getElementById('qnt');
        let newVal = parseInt(input.value) + v;
        if (newVal >= 1) input.value = newVal;
    }
</script>
</body>
</html>
